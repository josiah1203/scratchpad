name: Parser fuzz smoke

on:
  schedule:
    - cron: "47 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  FUZZ_TOOLCHAIN: nightly-2026-06-09
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz-smoke:
    name: ${{ matrix.target }} (bounded coverage-guided run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: project_graph
            seed: tests/fixtures/synthetic-campaign/project.json
          - target: command_envelope
            seed: tests/fixtures/replay-v1/operations.jsonl
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned nightly Rust toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --no-self-update

      - name: Install pinned cargo-fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Run bounded fuzz campaign
        run: >-
          cargo +"$FUZZ_TOOLCHAIN" fuzz run "${{ matrix.target }}" --
          -max_total_time=60 -max_len=262144 "${{ matrix.seed }}"
